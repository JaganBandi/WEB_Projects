<!DOCTYPE html>
<html>
<head>
    <title>Super Market</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        h1 {
            text-align: center;
        }

        /* Dropdown */
        select {
            padding: 10px;
            margin: 20px;
        }

        /* Slider */
        .slider {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }

        .slides {
            display: flex;
            animation: slide 10s infinite;
        }

        .slides img {
            width: 100%;
            height: 300px;
        }

        @keyframes slide {
            0% { margin-left: 0%; }
            33% { margin-left: -100%; }
            66% { margin-left: -200%; }
        }

        /* Products */
        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .product {
            background: white;
            padding: 15px;
            width: 200px;
            text-align: center;
            border-radius: 10px;
        }

        .product img {
            width: 100%;
            height: 150px;
        }

        .product a {
            text-decoration: none;
            color: white;
            background: green;
            padding: 8px;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<h1>🛒 Super Market Products</h1>

<!-- Dropdown Menu -->
<center>
<select>
    <option>Select Category</option>
    <option>Fruits</option>
    <option>Vegetables</option>
    <option>Dairy</option>
    <option>Snacks</option>
</select>
</center>

<!-- Image Slider -->
<div class="slider">
    <div class="slides">
        <img src="https://via.placeholder.com/800x300?text=Big+Sale">
        <img src="https://via.placeholder.com/800x300?text=Fresh+Fruits">
        <img src="https://via.placeholder.com/800x300?text=Daily+Essentials">
    </div>
</div>

<!-- Product Section -->
<div class="products">

    <div class="product">
        <img src="https://via.placeholder.com/200?text=Apple">
        <h3>Apple</h3>
        <p>₹120 / kg</p>
        <a href="product.html?item=Apple&price=120">View Product</a>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200?text=Milk">
        <h3>Milk</h3>
        <p>₹50 / liter</p>
        <a href="product.html?item=Milk&price=50">View Product</a>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200?text=Chips">
        <h3>Chips</h3>
        <p>₹30</p>
        <a href="product.html?item=Chips&price=30">View Product</a>
    </div>

</div>

</body>
</html>
