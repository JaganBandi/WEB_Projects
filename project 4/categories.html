<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Categories - ShopHaven</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #1f2933;
        }

        /* HEADER */
        header {
            background: #0f766e;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        header nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        /* HOME BUTTON */
        .home-btn {
            position: absolute;
            top: 20px;
            middle: 20px;
            background: #0f766e;
            color: white;
            padding: 10px 16px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        /* PAGE TITLE */
        h1 {
            text-align: center;
            color: #0f766e;
            margin-top: 80px;
        }

        /* CATEGORIES GRID */
        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            padding: 40px 20px;
        }

        .category-box {
            background: #ecfeff;
            width: 180px;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            font-weight: bold;
            color: #0f766e;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .category-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        /* FOOTER */
        footer {
            background: #0f766e;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }

        /* RESPONSIVE */
        @media screen and (max-width: 900px) {
            .category-box {
                width: 40%;
            }
        }

        @media screen and (max-width: 600px) {
            .category-box {
                width: 80%;
            }
        }

    </style>
</head>
<body>

<!-- HOME BUTTON -->
<a href="index.html" class="home-btn">🏠 Home</a>

<header>
    <h2>🛒 MyShop</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<h1>All Product Categories</h1>

<section class="categories">
    <div class="category-box">📱 Electronics</div>
    <div class="category-box">👗 Fashion</div>
    <div class="category-box">🍎 Grocery</div>
    <div class="category-box">🏠 Home & Kitchen</div>
    <div class="category-box">🎮 Gaming</div>
    <div class="category-box">💄 Beauty</div>
    <div class="category-box">📚 Books</div>
    <div class="category-box">🧸 Toys</div>
</section>

<footer>
    <p>© 2026 ShopHaven. All rights reserved.</p>
</footer>

</body>
</html>
