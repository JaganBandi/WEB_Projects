<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot Password</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #0f766e;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .forgot-box {
            background: white;
            width: 380px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #0f766e;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
        }

        button {
            background: #4338ca;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            margin-top: 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .note {
            font-size: 13px;
            color: #6b7280;
            margin-top: 10px;
            text-align: center;
        }

        .back {
            text-align: center;
            margin-top: 15px;
        }

        .back a {
            color: #0f766e;
            text-decoration: none;
            font-weight: bold;
        }
        .back-btn {
    position: absolute;
    top: 20px;
    left: 20px;   /* top-left corner */
    background: #0f766e;
    color: white;
    padding: 10px 16px;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
}
    </style>
</head>
<body>

<div class="forgot-box">
    <h2>🔑 Forgot Password</h2>

    <label>Email Address</label>
    <input type="email" placeholder="Enter registered email">

    <label>OTP</label>
    <input type="text" placeholder="Enter OTP">

    <label>New Password</label>
    <input type="password" placeholder="Enter new password">

    <button>Reset Password</button>

    <p class="note">
        OTP will be sent to your registered email
    </p>

    <div class="back">
        <a href="login.html">Back to Login</a>
    </div>
</div>

</body>
</html>
