<!DOCTYPE html>
<html lang="en">
<head>
    <title>User Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<!-- HOME BUTTON -->
<a href="index.html" class="home-btn">🏠 Home</a>
<a href="profile.html">profile</a>
<a href="profile.html" class="profile-btn">👤 Profile</a>

<div class="login-box">
    <h2>🔐 User Login</h2>

    <label>Email or Mobile</label>
    <input type="text" placeholder="Enter email or mobile">

    <label>Password</label>
    <input type="password" placeholder="Enter password">

    <div class="forgot">
        <a href="forgot-password.html">Forgot password?</a>
    </div>

    <button class="login-btn">Login</button>

    <div class="or">OR</div>

    <button class="social-btn google">Continue with Google</button>
    <button class="social-btn facebook">Continue with Facebook</button>

    <div class="signup">
        New user? <a href="register.html">Create an account</a>
    </div>
</div>
<script src="login.js"></script>
</body>
</html>
