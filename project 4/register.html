<!DOCTYPE html>
<html lang="en">
<head>
    <title>User Registration</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* HOME BUTTON */
        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #0f766e;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .register-box {
            background: white;
            width: 380px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .register-box h2 {
            text-align: center;
            color: #0f766e;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
        }

        .register-btn {
            background: #4338ca;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            margin-top: 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
        }

        .login-link a {
            color: #0f766e;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<a href="index.html" class="home-btn">🏠 Home</a>

<div class="register-box">
    <h2>📝 New User Registration</h2>

    <label>Full Name</label>
    <input type="text" placeholder="Enter full name">

    <label>Email</label>
    <input type="email" placeholder="Enter email">

    <label>Mobile Number</label>
    <input type="tel" placeholder="Enter mobile number">

    <label>Password</label>
    <input type="password" placeholder="Create password">

    <button class="register-btn">Register</button>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>
</div>

</body>
</html>
