<!DOCTYPE html>
<html>
<head>
    <title>Job Application Portal</title>
</head>
<body>

<h1>Job Application Portal</h1>
<p>Please fill the application form carefully</p>
<hr>

<form>

<h2>Personal Details</h2>
<label>Full Name:</label><br>
<input type="text"><br><br>

<label>Email:</label><br>
<input type="email"><br><br>

<label>Phone Number:</label><br>
<input type="tel"><br><br>

<label>Address:</label><br>
<textarea rows="4" cols="30"></textarea><br><br>

<h2>Job Details</h2>
<label>Job Role:</label><br>
<select>
    <option>Web Developer</option>
    <option>Python Developer</option>
    <option>Data Analyst</option>
</select><br><br>

<label>Experience Level:</label><br>
<input type="radio" name="exp"> Fresher<br>
<input type="radio" name="exp"> Experienced<br><br>

<h2>Skills</h2>
<input type="checkbox"> HTML<br>
<input type="checkbox"> CSS<br>
<input type="checkbox"> Python<br>
<input type="checkbox"> JavaScript<br><br>

<h2>Education Details</h2>
<table border="1">
<tr>
    <th>Qualification</th>
    <th>Institution</th>
    <th>Year</th>
</tr>
<tr>
    <td>Degree</td>
    <td>Sri Venkateswara College</td>
    <td>2026</td>
</tr>
<tr>
    <td>Intermediate</td>
    <td>Nalanda Junior College</td>
    <td>2023</td>
</tr>
</table>

<br>
<button type="submit">Apply for Job</button>

</form>

</body>
</html>
